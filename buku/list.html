<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daftar Buku - SIMPUS-Mini</title>
    <!-- CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Custom -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#1d5b8a;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>
            <button id="nav-toggle-btn" class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link active" href="list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/tambah.html">Tambah Anggota</a></li>
                </ul>
            </nav>
        </div>
    </header>
    
    <main class="container my-4">
        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="card-title mb-3" style="color:#1d5b8a;">Daftar Buku</h2>
                <div class="mb-3">
                    <a href="tambah.html" class="btn text-white" style="background-color:#1d5b8a;">Tambah Buku</a>
                    <button type="button" id="btn-reload" class="btn btn-outline-secondary ms-2">Muat Ulang</button>
                </div>
                <div class="search-box">
                    <label for="search-input">Cari Judul Buku</label>
                    <input type="text" id="search-input" placeholder="Ketik judul buku...">
                </div>
                <p id="table-counter" class="text-secondary mb-2"></p>
                <p id="loading-indicator" style="display:none;">Memuat data...</p>
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead style="background-color:#1d5b8a;">
                            <tr class="text-white">
                                <th>Judul</th>
                                <th>Pengarang</th>
                                <th>Tahun</th>
                                <th>Kategori</th>
                                <th>Stok</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Baris diisi dinamis oleh assets/js/buku.js via fetch('../data/buku.json') -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
    
    <footer class="text-center py-3 text-secondary">
        <p class="mb-0">&copy; 2026 SIMPUS-Mini - Jobsheet 3 (Bootstrap)</p>
    </footer>

    <!-- JavaScript Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/fetch-generik.js"></script>
    <script src="../assets/js/buku.js"></script>
</body>

</html>
